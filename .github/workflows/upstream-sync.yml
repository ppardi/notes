name: Upstream sync

# Watches the upstream repo for new stable tags. For each new one it merges the
# tag into sync/upstream-<tag>, keeps the fork's version number, adopts
# upstream's tested min/max Nextcloud versions, test-builds, and opens a PR.
# Conflicts open an issue instead and fail the run so you get notified.

on:
  schedule:
    - cron: "0 16 * * 1-5"   # 09:00 MST weekdays (Arizona has no DST)
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to merge (blank = latest stable)"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORK_BRANCH: ${{ github.ref_name }}   # the branch the run starts from: the default branch for scheduled runs

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.push.outputs.branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Find upstream tag
        id: find
        env:
          REQUESTED: ${{ inputs.upstream_tag }}
        run: |
          UPSTREAM_REPO=$(tr -d '[:space:]' < .fork/upstream-repo 2>/dev/null || true)
          [ -n "$UPSTREAM_REPO" ] || { echo "::error::.fork/upstream-repo is missing (e.g. nextcloud/notes)"; exit 1; }
          echo "UPSTREAM_REPO=$UPSTREAM_REPO" >> "$GITHUB_ENV"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          # Namespace upstream tags so they never collide with the fork's own v* tags.
          git fetch --no-tags upstream '+refs/tags/*:refs/tags/upstream/*'
          if [ -n "$REQUESTED" ]; then
            TAG="$REQUESTED"
          else
            TAG=$(git tag -l 'upstream/*' | sed 's#^upstream/##' \
                  | grep -E '^v?[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)
          fi
          git rev-parse -q --verify "refs/tags/upstream/${TAG}" >/dev/null \
            || { echo "::error::Upstream tag '${TAG}' not found"; exit 1; }

          BASE=$(cat .fork/upstream-base 2>/dev/null || echo none)
          BRANCH="sync/upstream-${TAG}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          if [ "$TAG" = "$BASE" ]; then
            echo "Fork is already based on ${TAG}."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "${BRANCH} already exists; leaving it for review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream tag
        id: merge
        if: steps.find.outputs.skip != 'true'
        env:
          TAG: ${{ steps.find.outputs.tag }}
          BRANCH: ${{ steps.find.outputs.branch }}
        run: |
          T=.github/scripts/fork_tools.py
          INFO=appinfo/info.xml
          git checkout -b "$BRANCH"

          FORK_VERSION=$(python3 $T get $INFO version)
          git show "refs/tags/upstream/${TAG}:${INFO}" > /tmp/upstream-info.xml
          UP_VERSION=$(python3 $T get /tmp/upstream-info.xml version)
          UP_MIN=$(python3 $T get /tmp/upstream-info.xml min)
          UP_MAX=$(python3 $T get /tmp/upstream-info.xml max)

          # Both sides change these lines every release, which would conflict every
          # time. Aligning them to upstream first makes the merge see identical edits.
          python3 $T set $INFO version "$UP_VERSION"
          python3 $T set $INFO min "$UP_MIN"
          python3 $T set $INFO max "$UP_MAX"
          git diff --quiet || git commit -am "Align info.xml with upstream ${TAG} before merge"

          if ! git merge --no-ff -m "Merge upstream ${TAG}" "refs/tags/upstream/${TAG}"; then
            {
              echo "conflicts<<EOF"
              git diff --name-only --diff-filter=U | sed 's/^/- /'
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            git merge --abort
            echo "conflicted=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Put the fork's version back; keep upstream's tested compatibility range.
          python3 $T set $INFO version "$FORK_VERSION"
          mkdir -p .fork && echo "$TAG" > .fork/upstream-base
          git add $INFO .fork/upstream-base
          git commit -m "Restore fork version ${FORK_VERSION}; record upstream base ${TAG}"

          echo "min=$UP_MIN" >> "$GITHUB_OUTPUT"
          echo "max=$UP_MAX" >> "$GITHUB_OUTPUT"
          if git diff --name-only "${FORK_BRANCH}...HEAD" | grep -qE '^(lib/Migration/|appinfo/database\.xml)'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push branch and open PR
        id: push
        if: steps.find.outputs.skip != 'true' && steps.merge.outputs.conflicted != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          BRANCH: ${{ steps.find.outputs.branch }}
          MIN: ${{ steps.merge.outputs.min }}
          MAX: ${{ steps.merge.outputs.max }}
          MIGRATIONS: ${{ steps.merge.outputs.migrations }}
        run: |
          git push origin "$BRANCH"
          NOTE=""
          if [ "$MIGRATIONS" = "true" ]; then
            NOTE=$'\n\n**Touches migrations.** custom-app-watch will hold the release for your approval.'
          fi
          gh pr create --base "$FORK_BRANCH" --head "$BRANCH" \
            --title "Merge upstream ${TAG}" \
            --body "Automated merge of ${UPSTREAM_REPO} ${TAG}. Nextcloud compatibility is now min ${MIN:-unset}, max ${MAX:-unset} (taken from upstream). The test build runs in the same Actions run as this PR's creation.${NOTE}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Report conflicts
        if: steps.merge.outputs.conflicted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.find.outputs.tag }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          TITLE="Upstream ${TAG} needs a manual merge"
          # jq prints the string "null" for an empty result, which is not an empty
          # string, so a bare '.[0].number' made this test always false and the
          # issue was never created. '// empty' prints nothing instead.
          EXISTING=$(gh issue list --state open --search "\"${TITLE}\" in:title" --json number --jq '.[0].number // empty')
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$(printf 'Merging %s %s into %s conflicted in:\n\n%s\n\nResolve locally on a sync/upstream-<tag> branch, write the tag to .fork/upstream-base, and open a PR.' "$UPSTREAM_REPO" "$TAG" "$FORK_BRANCH" "$CONFLICTS")"
          fi
          echo "::error::Merge conflicts with upstream ${TAG}"
          exit 1

  build:
    needs: merge
    if: needs.merge.outputs.branch != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.merge.outputs.branch }}
